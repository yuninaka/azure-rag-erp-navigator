[project]
name = "azure-rag-erp-navigator"
version = "0.1.0"
description = "Azure OpenAI + AI Search + Cosmos DB based RAG hands-on for ERP navigation"
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.16.4",
    "azure-search-documents>=12.0.0",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
